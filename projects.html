<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Projects built by Team Byte while learning web development.">
  <title>Projects | Team Byte</title>
  <link rel="stylesheet" href="css/styles.css">

<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">

      <a class="logo" href="index.html">Team Byte</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>

          <li><a href="contact.html">Contact</a></li>
        </ul>

    <header class="page-header">
      <h1>Our projects</h1>

      <p>Turn on JavaScript to see the project list.</p>

  <footer class="site-footer">
